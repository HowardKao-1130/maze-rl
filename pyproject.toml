[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "maze-rl"
version = "0.1.0"
description = "Reinforcement learning experiments for maze navigation"
requires-python = ">=3.11"

dependencies = [
    "numpy",
    "matplotlib",
    "tqdm",
    "gymnasium",
    "tensorboard",
]


[project.optional-dependencies]
dev = [
    "pytest",
]


[tool.setuptools.packages.find]
where = ["src"]